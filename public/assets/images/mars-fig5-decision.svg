<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Decision diagram: if you already run SFT and serve at small-to-moderate batch, MARS costs one extra SFT run and nothing at serving; two off-ramps for very large batch and exact-distribution needs">
  <style>
    :root{
      --ink:#3A3532; --sub:#7D766E; --accent:#C85A3C; --keep:#4E8D6E;
      --line:#C9BEAE; --panel:#FFFFFF; --stroke:#E1D9CD; --winbg:#F7E7DD;
      --bg:#F9F6F0; --mono:ui-monospace,'JetBrains Mono',monospace;
    }
    @media (prefers-color-scheme: dark){
      :root{ --ink:#EBE5DF; --sub:#A1A8A4; --accent:#D99441; --keep:#6FBF97;
        --line:#4A524C; --panel:#262C28; --stroke:#3E4641; --winbg:#33291F; --bg:#1E2320; }
    }
    .q    { fill:var(--panel); stroke:var(--stroke); stroke-width:1.5; }
    .qt   { fill:var(--ink); font-size:13px; font-weight:600; }
    .edge { stroke:var(--line); stroke-width:2; fill:none; }
    .yes  { font-family:var(--mono); font-size:10px; letter-spacing:.08em; fill:var(--keep); }
    .no   { font-family:var(--mono); font-size:10px; letter-spacing:.08em; fill:var(--accent); }
    .off  { fill:var(--sub); font-size:11px; }
    .offt { fill:var(--ink); font-size:11.5px; }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--line)"/></marker>
  </defs>

  <rect x="0" y="0" width="780" height="360" fill="var(--bg)"/>

  <!-- Q1 -->
  <rect class="q" x="30" y="40" width="180" height="60" rx="12"/>
  <text class="qt" x="120" y="66" text-anchor="middle">Do you already</text>
  <text class="qt" x="120" y="84" text-anchor="middle">run SFT?</text>

  <!-- Q1 -> Q2 (yes) -->
  <path class="edge" marker-end="url(#a)" d="M210 70 L280 70"/>
  <text class="yes" x="245" y="60" text-anchor="middle">YES</text>

  <!-- Q2 -->
  <rect class="q" x="285" y="40" width="200" height="60" rx="12"/>
  <text class="qt" x="385" y="66" text-anchor="middle">Serve at small-to-</text>
  <text class="qt" x="385" y="84" text-anchor="middle">moderate batch?</text>

  <!-- Q2 -> WIN (yes) -->
  <path class="edge" marker-end="url(#a)" d="M485 70 L555 70"/>
  <text class="yes" x="520" y="60" text-anchor="middle">YES</text>

  <!-- WIN -->
  <rect x="558" y="30" width="200" height="80" rx="12" fill="var(--winbg)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="658" y="56" text-anchor="middle" font-family="var(--mono)" font-size="11" letter-spacing=".08em" fill="var(--accent)">USE MARS</text>
  <text class="offt" x="658" y="76" text-anchor="middle">+1 SFT run,</text>
  <text class="offt" x="658" y="92" text-anchor="middle">nothing at serving time</text>

  <!-- Off-ramp 1: Q2 no -> very large batch -->
  <path class="edge" marker-end="url(#a)" d="M385 100 L385 168"/>
  <text class="no" x="400" y="130" text-anchor="start">NO · very large batch</text>
  <rect class="q" x="285" y="170" width="200" height="58" rx="12"/>
  <text class="offt" x="385" y="195" text-anchor="middle">Route to plain AR</text>
  <text class="off"  x="385" y="213" text-anchor="middle">no advantage there, by design</text>

  <!-- Off-ramp 2: need exact distribution -->
  <path class="edge" marker-end="url(#a)" d="M658 110 L658 168"/>
  <text class="no" x="672" y="140" text-anchor="start">NEED EXACT MATCH</text>
  <rect class="q" x="558" y="170" width="200" height="58" rx="12"/>
  <text class="offt" x="658" y="192" text-anchor="middle">MARS as the draft in</text>
  <text class="offt" x="658" y="208" text-anchor="middle">speculative decoding</text>
  <text class="off"  x="658" y="222" text-anchor="middle"></text>

  <!-- bottom note -->
  <text class="off" x="30" y="300" font-family="var(--mono)" font-size="11" fill="var(--sub)">Same weights serve every branch. The fallback to plain AR decoding is exact and free.</text>
</svg>

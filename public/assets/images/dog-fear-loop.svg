<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="ui-sans-serif, system-ui, sans-serif" role="img" aria-label="The fear reinforcement loop">
  <style>
    :root{
      --ink:#3A3532; --sub:#7D766E; --accent:#C85A3C;
      --line:#C9BEAE; --card:#FFFFFF; --stroke:#E1D9CD; --mono:ui-monospace,'JetBrains Mono',monospace;
    }
    @media (prefers-color-scheme: dark){
      :root{ --ink:#EBE5DF; --sub:#A1A8A4; --accent:#D99441; --line:#4A524C; --card:#262C28; --stroke:#3E4641; }
    }
    .card{ fill:var(--card); stroke:var(--stroke); stroke-width:1.5; }
    .idx{ font-family:var(--mono); font-size:12px; letter-spacing:.12em; fill:var(--accent); }
    .lab{ font-size:16px; font-weight:600; fill:var(--ink); }
    .arrow{ fill:none; stroke:var(--line); stroke-width:2.5; }
    .arrowR{ fill:none; stroke:var(--accent); stroke-width:2.8; }
    .center{ font-family:var(--mono); font-size:12.5px; letter-spacing:.18em; fill:var(--sub); }
    .badge{ font-family:var(--mono); font-size:12px; fill:var(--accent); font-weight:700; }
  </style>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--line)"/></marker>
    <marker id="ahR" markerWidth="11" markerHeight="11" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--accent)"/></marker>
  </defs>

  <!-- arrows (clockwise) -->
  <path class="arrow"  marker-end="url(#ah)"  d="M 525 92  Q 630 120 655 205"/>
  <path class="arrow"  marker-end="url(#ah)"  d="M 668 305 Q 660 400 545 425"/>
  <path class="arrow"  marker-end="url(#ah)"  d="M 295 428 Q 190 400 165 305"/>
  <path class="arrowR" marker-end="url(#ahR)" d="M 165 205 Q 190 120 295 95"/>

  <!-- reinforcement badge on closing arrow -->
  <text class="badge" x="150" y="150" text-anchor="middle">↻ REINFORCED</text>

  <!-- center label -->
  <text class="center" x="410" y="255" text-anchor="middle">THE TRAP</text>
  <text class="center" x="410" y="278" text-anchor="middle" font-size="11" fill="var(--sub)">every turn makes it worse</text>

  <!-- N1 top: trigger -->
  <rect class="card" x="295" y="24" width="230" height="80" rx="14"/>
  <text class="idx" x="315" y="52">① TRIGGER</text>
  <text class="lab" x="315" y="76">You do something</text>
  <text class="lab" x="315" y="95">the dog dislikes</text>

  <!-- N2 right: aggression -->
  <rect class="card" x="560" y="214" width="230" height="80" rx="14"/>
  <text class="idx" x="580" y="242">② DOG ACTS</text>
  <text class="lab" x="580" y="266">Growls, then</text>
  <text class="lab" x="580" y="285">snaps at you</text>

  <!-- N3 bottom: human retreats -->
  <rect class="card" x="295" y="404" width="230" height="80" rx="14"/>
  <text class="idx" x="315" y="432">③ YOU RETREAT</text>
  <text class="lab" x="315" y="456">You flinch and</text>
  <text class="lab" x="315" y="475">back off</text>

  <!-- N4 left: reward -->
  <rect class="card" x="30" y="214" width="230" height="80" rx="14"/>
  <text class="idx" x="50" y="242" fill="var(--accent)">④ REWARD</text>
  <text class="lab" x="50" y="266">The scary thing</text>
  <text class="lab" x="50" y="285">stopped. It worked.</text>
</svg>
